  <polygon points="200,30 320,230 80,230" fill="url(#mountain)"/>
  <polygon points="200,30 260,230 140,230" fill="rgba(106,27,154,0.6)"/>
  <!-- 눈 정상 -->
  <polygon points="200,30 220,90 180,90" fill="rgba(255,255,255,0.8)"/>
  <!-- 곰 실루엣 -->
  <ellipse cx="148" cy="210" rx="28" ry="22" fill="rgba(40,20,10,0.8)"/>
  <circle cx="148" cy="192" r="16" fill="rgba(40,20,10,0.8)"/>
  <ellipse cx="136" cy="185" rx="7" ry="9" fill="rgba(40,20,10,0.8)"/>
