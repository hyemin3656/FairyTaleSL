  <ellipse cx="148" cy="197" rx="9" ry="7" fill="rgba(80,50,30,0.6)"/>
  <!-- 호랑이 실루엣 -->
  <ellipse cx="258" cy="212" rx="32" ry="20" fill="rgba(200,120,0,0.8)"/>
  <circle cx="250" cy="196" r="14" fill="rgba(200,120,0,0.8)"/>
  <ellipse cx="240" cy="189" rx="6" ry="8" fill="rgba(200,120,0,0.8)"/>
  <ellipse cx="262" cy="188" rx="6" ry="8" fill="rgba(200,120,0,0.8)"/>
  <!-- 호랑이 줄무늬 -->
  <line x1="248" y1="204" x2="242" y2="220" stroke="rgba(100,60,0,0.5)" stroke-width="3"/>
  <line x1="258" y1="204" x2="264" y2="220" stroke="rgba(100,60,0,0.5)" stroke-width="3"/>
  <!-- 별 -->
