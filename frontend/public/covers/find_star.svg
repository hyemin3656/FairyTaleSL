<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A2E;stop-opacity:1"/>
      <stop offset="40%" style="stop-color:#1A0533;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0D2060;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFF176;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#FFD54F;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#FF8F00;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="planetGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" style="stop-color:#7986CB;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#283593;stop-opacity:1"/>
    </radialGradient>
    <radialGradient id="moonGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#FFF9C4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#F9A825;stop-opacity:1"/>
    </radialGradient>
    <radialGradient id="blackHole" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#1A0033;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#4A148C;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 우주 배경 -->
  <rect width="400" height="300" fill="url(#spaceBg)"/>

  <!-- 은하수 느낌 -->
  <ellipse cx="200" cy="150" rx="220" ry="60" fill="#3949AB" opacity="0.08" transform="rotate(-20,200,150)"/>

  <!-- 별들 -->
  <circle cx="20" cy="25" r="1.5" fill="white" opacity="0.9" filter="url(#glow)"/>
  <circle cx="60" cy="15" r="1" fill="white" opacity="0.7"/>
  <circle cx="100" cy="40" r="2" fill="white" opacity="0.9" filter="url(#glow)"/>
  <circle cx="155" cy="20" r="1" fill="white" opacity="0.8"/>
  <circle cx="220" cy="30" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="270" cy="10" r="1" fill="white" opacity="0.9"/>
  <circle cx="360" cy="40" r="2" fill="white" opacity="0.8" filter="url(#glow)"/>
  <circle cx="385" cy="20" r="1" fill="white" opacity="0.6"/>
  <circle cx="40" cy="80" r="1" fill="white" opacity="0.7"/>
  <circle cx="80" cy="100" r="1.5" fill="#B0BEF3" opacity="0.8"/>
  <circle cx="330" cy="90" r="1" fill="white" opacity="0.7"/>
  <circle cx="375" cy="110" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="15" cy="140" r="1" fill="white" opacity="0.8"/>
  <circle cx="390" cy="160" r="1" fill="white" opacity="0.7"/>
  <circle cx="45" cy="200" r="1.5" fill="#B0BEF3" opacity="0.6"/>
  <circle cx="370" cy="220" r="1" fill="white" opacity="0.8"/>

  <!-- 블랙홀 (오른쪽 상단) -->
  <circle cx="340" cy="100" r="35" fill="url(#blackHole)"/>
  <!-- 블랙홀 링 -->
  <ellipse cx="340" cy="108" rx="50" ry="12" fill="none" stroke="#7B1FA2" stroke-width="4" opacity="0.6" transform="rotate(-15,340,108)"/>
  <ellipse cx="340" cy="108" rx="55" ry="14" fill="none" stroke="#9C27B0" stroke-width="2" opacity="0.4" transform="rotate(-15,340,108)"/>
  <ellipse cx="340" cy="108" rx="45" ry="10" fill="none" stroke="#E040FB" stroke-width="2" opacity="0.5" transform="rotate(-15,340,108)"/>

  <!-- 달 -->
  <circle cx="80" cy="85" r="30" fill="url(#moonGrad)"/>
  <circle cx="70" cy="75" r="6" fill="#F9A825" opacity="0.3"/>
  <circle cx="90" cy="92" r="4" fill="#F9A825" opacity="0.3"/>
  <circle cx="75" cy="95" r="3" fill="#F9A825" opacity="0.3"/>
  <!-- 달토끼 실루엣 -->
  <ellipse cx="82" cy="87" rx="8" ry="6" fill="#E65100" opacity="0.4"/>
  <circle cx="86" cy="82" r="5" fill="#E65100" opacity="0.4"/>
  <ellipse cx="83" cy="76" rx="2" ry="5" fill="#E65500" opacity="0.4"/>
  <ellipse cx="88" cy="75" rx="2" ry="5" fill="#E65500" opacity="0.4"/>

  <!-- 행성 (왼쪽 아래) -->
  <circle cx="50" cy="240" r="42" fill="url(#planetGrad)"/>
  <!-- 행성 링 -->
  <ellipse cx="50" cy="240" rx="65" ry="14" fill="none" stroke="#9FA8DA" stroke-width="5" opacity="0.5"/>
  <ellipse cx="50" cy="240" rx="70" ry="16" fill="none" stroke="#7986CB" stroke-width="3" opacity="0.3"/>
  <!-- 행성 표면 패턴 -->
  <ellipse cx="42" cy="228" rx="20" ry="6" fill="#3F51B5" opacity="0.3" transform="rotate(-20,42,228)"/>
  <ellipse cx="58" cy="248" rx="18" ry="5" fill="#5C6BC0" opacity="0.3" transform="rotate(10,58,248)"/>

  <!-- 빛나는 별 (목표 별) -->
  <circle cx="285" cy="85" r="20" fill="url(#starGlow)" opacity="0.8"/>
  <polygon points="285,60 290,78 308,78 294,89 299,107 285,96 271,107 276,89 262,78 280,78"
           fill="#FFD700" filter="url(#glow)" opacity="0.95"/>
  <!-- 별 빛줄기 -->
  <line x1="285" y1="52" x2="285" y2="42" stroke="#FFF176" stroke-width="2" opacity="0.7"/>
  <line x1="315" y1="62" x2="322" y2="55" stroke="#FFF176" stroke-width="2" opacity="0.7"/>
  <line x1="318" y1="90" x2="328" y2="93" stroke="#FFF176" stroke-width="2" opacity="0.7"/>
  <line x1="255" y1="62" x2="248" y2="55" stroke="#FFF176" stroke-width="2" opacity="0.7"/>
  <line x1="252" y1="90" x2="242" y2="93" stroke="#FFF176" stroke-width="2" opacity="0.7"/>

  <!-- 소녀 (우주복) -->
  <!-- 비행 궤적 -->
  <path d="M370,280 Q320,220 250,175 Q200,150 170,140" stroke="#64B5F6" stroke-width="1.5" fill="none" stroke-dasharray="5,4" opacity="0.5"/>

  <!-- 몸통 (우주복) -->
  <ellipse cx="175" cy="175" rx="18" ry="22" fill="#E3F2FD"/>
  <!-- 배낭/산소통 -->
  <rect x="157" y="165" width="10" height="18" rx="3" fill="#90CAF9"/>
  <!-- 팔 -->
  <path d="M193,168 Q205,158 215,163" stroke="#E3F2FD" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="217" cy="164" r="5" fill="#BBDEFB"/>
  <path d="M157,170 Q145,165 140,172" stroke="#E3F2FD" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="138" cy="173" r="5" fill="#BBDEFB"/>
  <!-- 다리 -->
  <path d="M168,196 Q163,212 161,225" stroke="#E3F2FD" stroke-width="8" stroke-linecap="round" fill="none"/>
  <ellipse cx="160" cy="227" rx="7" ry="5" fill="#90CAF9"/>
  <path d="M182,196 Q187,212 189,225" stroke="#E3F2FD" stroke-width="8" stroke-linecap="round" fill="none"/>
  <ellipse cx="190" cy="227" rx="7" ry="5" fill="#90CAF9"/>
  <!-- 헬멧 -->
  <circle cx="175" cy="153" r="19" fill="#1565C0" opacity="0.8"/>
  <circle cx="175" cy="153" r="16" fill="#E3F2FD" opacity="0.3"/>
  <!-- 헬멧 반사 -->
  <circle cx="168" cy="147" r="5" fill="white" opacity="0.4"/>
  <!-- 얼굴 -->
  <circle cx="175" cy="153" r="11" fill="#FFCC80"/>
  <circle cx="171" cy="151" r="2" fill="#5D4037"/>
  <circle cx="179" cy="151" r="2" fill="#5D4037"/>
  <path d="M171,158 Q175,162 179,158" stroke="#5D4037" stroke-width="1.5" fill="none"/>
  <!-- 머리카락 -->
  <path d="M164,146 Q167,138 175,136 Q183,138 186,146" fill="#5D4037"/>

  <!-- 제목 -->
  <rect x="0" y="0" width="400" height="50" fill="rgba(0,0,0,0.55)"/>
  <text x="200" y="32" font-family="'Apple SD Gothic Neo', Arial" font-size="22" font-weight="bold" fill="#FFD54F" text-anchor="middle" filter="url(#glow)">별이를 찾아서</text>
</svg>
