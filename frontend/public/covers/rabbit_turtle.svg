<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- 하늘 배경 -->
  <defs>
    <linearGradient id="sky1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F7FA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ground1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8BC34A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#558B2F;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#sky1)"/>

  <!-- 구름 -->
  <ellipse cx="80" cy="50" rx="35" ry="20" fill="white" opacity="0.9"/>
  <ellipse cx="110" cy="42" rx="30" ry="18" fill="white" opacity="0.9"/>
  <ellipse cx="55" cy="55" rx="22" ry="14" fill="white" opacity="0.9"/>

  <ellipse cx="300" cy="70" rx="30" ry="18" fill="white" opacity="0.9"/>
  <ellipse cx="325" cy="62" rx="25" ry="15" fill="white" opacity="0.9"/>

  <!-- 땅 -->
  <rect x="0" y="210" width="400" height="90" fill="url(#ground1)"/>

  <!-- 길 -->
  <ellipse cx="200" cy="215" rx="180" ry="15" fill="#D4A96A" opacity="0.6"/>
  <rect x="30" y="210" width="340" height="10" fill="#C4965A" opacity="0.5"/>

  <!-- 결승선 -->
  <rect x="310" y="150" width="8" height="70" fill="#555"/>
  <rect x="310" y="150" width="40" height="20" fill="#E53935"/>
  <rect x="330" y="150" width="10" height="10" fill="white"/>
  <rect x="310" y="160" width="10" height="10" fill="white"/>
  <rect x="330" y="160" width="10" height="10" fill="#E53935"/>
  <text x="356" y="145" font-family="Arial" font-size="11" fill="#E53935" font-weight="bold">GOAL</text>

  <!-- 나무 -->
  <rect x="350" y="175" width="10" height="40" fill="#795548"/>
  <circle cx="355" cy="162" r="22" fill="#388E3C"/>
  <circle cx="340" cy="170" r="16" fill="#43A047"/>
  <circle cx="370" cy="170" r="16" fill="#2E7D32"/>

  <rect x="25" y="185" width="8" height="28" fill="#795548"/>
  <circle cx="29" cy="174" r="18" fill="#388E3C"/>
  <circle cx="18" cy="180" r="12" fill="#43A047"/>

  <!-- 토끼 (왼쪽, 낮잠) -->
  <!-- 몸 -->
  <ellipse cx="130" cy="200" rx="32" ry="20" fill="white"/>
  <!-- 머리 -->
  <circle cx="158" cy="192" r="18" fill="white"/>
  <!-- 귀 -->
  <ellipse cx="152" cy="173" rx="5" ry="14" fill="white" stroke="#ddd" stroke-width="1"/>
  <ellipse cx="163" cy="171" rx="5" ry="14" fill="white" stroke="#ddd" stroke-width="1"/>
  <ellipse cx="152" cy="173" rx="3" ry="10" fill="#FFB6C1"/>
  <ellipse cx="163" cy="171" rx="3" ry="10" fill="#FFB6C1"/>
  <!-- 눈 (감은 눈 - 낮잠) -->
  <path d="M152 192 Q155 189 158 192" stroke="#555" stroke-width="1.5" fill="none"/>
  <path d="M160 192 Q163 189 166 192" stroke="#555" stroke-width="1.5" fill="none"/>
  <!-- 코 -->
  <ellipse cx="159" cy="196" rx="3" ry="2" fill="#FFB6C1"/>
  <!-- 꼬리 -->
  <circle cx="100" cy="198" r="8" fill="#f0f0f0"/>
  <!-- Z Z Z -->
  <text x="170" y="178" font-family="Arial" font-size="13" fill="#4A90D9" font-weight="bold" opacity="0.8">z</text>
  <text x="180" y="168" font-family="Arial" font-size="16" fill="#4A90D9" font-weight="bold" opacity="0.8">z</text>
  <text x="193" y="155" font-family="Arial" font-size="19" fill="#4A90D9" font-weight="bold" opacity="0.8">z</text>

  <!-- 거북이 (오른쪽, 달리는 중) -->
  <!-- 몸 (등껍질) -->
  <ellipse cx="270" cy="205" rx="28" ry="20" fill="#558B2F"/>
  <!-- 등껍질 무늬 -->
  <ellipse cx="270" cy="205" rx="20" ry="14" fill="#7CB342" stroke="#558B2F" stroke-width="1"/>
  <line x1="270" y1="191" x2="270" y2="219" stroke="#558B2F" stroke-width="1.5"/>
  <line x1="252" y1="202" x2="288" y2="208" stroke="#558B2F" stroke-width="1.5"/>
  <line x1="256" y1="196" x2="284" y2="214" stroke="#558B2F" stroke-width="1"/>
  <line x1="256" y1="214" x2="284" y2="196" stroke="#558B2F" stroke-width="1"/>
  <!-- 머리 -->
  <ellipse cx="296" cy="200" rx="14" ry="11" fill="#8BC34A"/>
  <!-- 눈 -->
  <circle cx="301" cy="197" r="3" fill="white"/>
  <circle cx="302" cy="197" r="2" fill="#333"/>
  <!-- 입 (웃음) -->
  <path d="M293 205 Q298 209 303 205" stroke="#555" stroke-width="1.5" fill="none"/>
  <!-- 다리 -->
  <ellipse cx="252" cy="222" rx="8" ry="6" fill="#8BC34A" transform="rotate(-30,252,222)"/>
  <ellipse cx="264" cy="224" rx="8" ry="6" fill="#8BC34A" transform="rotate(20,264,224)"/>
  <ellipse cx="280" cy="224" rx="8" ry="6" fill="#8BC34A" transform="rotate(-15,280,224)"/>
  <ellipse cx="292" cy="220" rx="8" ry="6" fill="#8BC34A" transform="rotate(25,292,220)"/>
  <!-- 꼬리 -->
  <ellipse cx="244" cy="208" rx="5" ry="4" fill="#558B2F"/>

  <!-- 제목 -->
  <rect x="0" y="0" width="400" height="50" fill="rgba(0,0,0,0.35)"/>
  <text x="200" y="32" font-family="'Apple SD Gothic Neo', Arial" font-size="22" font-weight="bold" fill="white" text-anchor="middle">토끼와 거북이</text>
</svg>
