  <path d="M350 180 Q320 175 300 185" stroke="rgba(60,30,10,0.8)" stroke-width="3" fill="none"/>
  <!-- 기둥 -->
  <rect x="100" y="180" width="15" height="100" fill="rgba(120,70,30,0.8)"/>
  <rect x="285" y="180" width="15" height="100" fill="rgba(120,70,30,0.8)"/>
  <!-- 문 -->
  <rect x="180" y="210" width="40" height="70" fill="rgba(80,40,15,0.7)"/>
  <!-- 장화 (왼쪽 꽃) 붉은 장미 -->
  <circle cx="120" cy="245" r="22" fill="#c62828"/>
  <circle cx="120" cy="245" r="16" fill="#e53935"/>
  <circle cx="120" cy="245" r="10" fill="#ef9a9a"/>
  <circle cx="112" cy="237" r="9" fill="#e53935"/>
  <circle cx="128" cy="237" r="9" fill="#e53935"/>
  <rect x="117" y="267" width="6" height="18" fill="#2e7d32" rx="3"/>
  <path d="M105 275 Q117 268 123 278" fill="#388e3c"/>
