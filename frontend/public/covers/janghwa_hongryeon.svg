  <ellipse cx="280" cy="250" rx="20" ry="25" fill="#FFF9C4"/>
  <ellipse cx="262" cy="243" rx="16" ry="28" fill="#EF9A9A" transform="rotate(-20,262,243)"/>
  <ellipse cx="298" cy="243" rx="16" ry="28" fill="#EF9A9A" transform="rotate(20,298,243)"/>
  <ellipse cx="280" cy="235" rx="15" ry="28" fill="#FFCDD2"/>
